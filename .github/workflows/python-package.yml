name: Testing

on:
  push:
    branches: ['**']      # tags are covered by the release workflow, which calls this one
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and the test tools
        run: |
          python -m pip install --upgrade pip
          pip install . pytest flake8
      - name: Check that the installed package imports
        # run outside the repository, so lvm_read.py in the working directory
        # cannot stand in for the installed package
        run: |
          cd "${{ runner.temp }}"
          python -c "import lvm_read; print(lvm_read.__version__, lvm_read.__file__)"
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        run: pytest
